name: wallapop
version: 1.0.0
id: wallapop
version: 0.0.1
description: "Search Wallapop - Spanish second-hand marketplace"
author: Gorkaseto
license: MIT
tags:
  - marketplace
  - scraping
  - espana
  - classifieds

# Tools this plugin registers via register(ctx). Hermes uses this list for
# catalog chips, the "declared tools" validation, and auth hints.
provides_tools:
  - wallapop_search
  - wallapop_get_item

# Python dependencies. Hermes installs these before enabling the plugin.
# Bounded ranges: floor on an API-compatible version, upper bound at next major.
# lxml >=6.0.1 is required for a cp314 wheel (Python 3.14); the 5.x series has
# no cp314 wheel, so uv falls back to a source build that needs libxml2/libxslt.
python_dependencies:
  - "requests>=2.28,<3"
  - "beautifulsoup4>=4.12,<5"
  - "lxml>=4.9,<7"
