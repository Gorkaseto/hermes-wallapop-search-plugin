name: wallapop
id: wallapop
version: 0.0.1
description: "Search Wallapop - Spanish second-hand marketplace"
author: Gorkaseto
license: MIT
tags:
  - marketplace
  - scraping
  - espana
  - classifieds

# Tools this plugin registers via register(ctx). Hermes uses this list for
# catalog chips, the "declared tools" validation, and auth hints.
provides_tools:
  - wallapop_search
  - wallapop_get_item

# Python dependencies. Hermes installs these before enabling the plugin.
python_dependencies:
  - "playwright>=1.40,<2"
