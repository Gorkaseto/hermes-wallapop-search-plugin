[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-wallapop-plugin"
version = "1.0.0"
description = "Wallapop plugin for Hermes Agent - Spanish second-hand marketplace"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Gorkaseto"}
]
keywords = ["wallapop", "scraping", "marketplace", "classifieds", "spain"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "requests>=2.28,<3",
    "beautifulsoup4>=4.12,<5",
    "lxml>=4.9,<7",
]

[project.optional-dependencies]
# Optional: browser rendering for JavaScript-heavy pages. Browsers are installed
# separately with `playwright install chromium`.
browser = [
    "playwright>=1.40,<2",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "flake8>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/Gorkaseto/hermes-wallapop-search-plugin"
Documentation = "https://github.com/Gorkaseto/hermes-wallapop-search-plugin#readme"
Repository = "https://github.com/Gorkaseto/hermes-wallapop-search-plugin.git"

# The plugin modules live at the repo root (the native Hermes plugin layout).
# Map them to an importable package named "wallapop" so `pip install -e .` works.
[tool.setuptools]
packages = ["wallapop"]
package-dir = {"wallapop" = "."}

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
python_files = ["test_*.py"]
python_functions = ["test_*"]
